<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudentLink - Demo Interactive</title>
<style>
:root {
  --bg: #eef3fb;
  --bg-2: #e8eef9;
  --surface: rgba(255,255,255,.72);
  --card: #ffffff;
  --text: #15213f;
  --muted: #7d8ca6;
  --line: #dbe5f4;
  --blue: #2f6cf6;
  --blue-2: #1f56c7;
  --blue-soft: #eaf2ff;
  --green: #30c780;
  --green-soft: #ebfbf2;
  --orange: #f7a63f;
  --orange-soft: #fff5e8;
  --danger: #ff667e;
  --shadow: 0 20px 45px rgba(24,55,120,.16);
  --phone-shadow: 0 34px 60px rgba(16,31,68,.25);
  --radius-xl: 30px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --safe-top: 54px;
  --safe-bottom: 94px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 12% 16%, rgba(47,108,246,.18), transparent 24%),
    radial-gradient(circle at 86% 18%, rgba(48,199,128,.14), transparent 19%),
    radial-gradient(circle at 82% 86%, rgba(47,108,246,.10), transparent 20%),
    linear-gradient(180deg, var(--bg) 0%, #f6f9ff 100%);
}
body {
  min-height: 100vh;
  overflow: hidden;
}
.app-stage {
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 28px 20px 24px;
  position: relative;
}
.desktop-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.desktop-glow::before,
.desktop-glow::after {
  content: "";
  position: absolute;
  width: 340px;
  height: 340px;
  border-radius: 999px;
  filter: blur(30px);
  opacity: .18;
}
.desktop-glow::before {
  left: -60px;
  top: 120px;
  background: #79a8ff;
}
.desktop-glow::after {
  right: -60px;
  bottom: 100px;
  background: #7ee7bc;
}
.phone-wrap {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin-top: 0;
}
.desktop-toolbar {
  position: absolute;
  top: 18px;
  right: 18px;
  z-index: 2;
  display: flex;
  gap: 8px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255,255,255,.7);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(17,40,86,.10);
}
.toolbar-btn {
  border: 1px solid rgba(47,108,246,.14);
  background: white;
  color: var(--text);
  border-radius: 999px;
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.toolbar-btn.primary {
  background: linear-gradient(180deg, var(--blue) 0%, var(--blue-2) 100%);
  color: white;
  border-color: transparent;
}
.phone-shell {
  width: min(430px, calc(100vw - 24px));
}
.phone {
  width: 100%;
  aspect-ratio: 430 / 900;
  max-height: calc(100vh - 110px);
  min-height: 760px;
  background: linear-gradient(180deg, #12151f 0%, #090b10 100%);
  border-radius: 48px;
  padding: 12px;
  box-shadow: var(--phone-shadow);
  position: relative;
}
.phone::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 38px;
  border: 1px solid rgba(255,255,255,.06);
  pointer-events: none;
}
.device-screen {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #f5f8fe 0%, #edf3fd 100%);
  border-radius: 36px;
  overflow: hidden;
  position: relative;
}
.notch {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 122px;
  height: 30px;
  border-radius: 0 0 20px 20px;
  background: #07090d;
  z-index: 6;
}
.status-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 40px;
  padding: 12px 18px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  z-index: 5;
  color: #0f1c37;
}
.status-icons {
  display: flex;
  gap: 8px;
  align-items: center;
}
.status-pill {
  width: 16px;
  height: 8px;
  border-radius: 999px;
  border: 1.5px solid currentColor;
  position: relative;
}
.status-pill::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 2px;
  width: 2px;
  height: 4px;
  border-radius: 999px;
  background: currentColor;
}
.status-bars {
  display: flex;
  gap: 2px;
  align-items: end;
}
.status-bars span {
  display: block;
  width: 2px;
  border-radius: 999px;
  background: currentColor;
}
.status-bars span:nth-child(1) { height: 4px; }
.status-bars span:nth-child(2) { height: 6px; }
.status-bars span:nth-child(3) { height: 8px; }
.status-bars span:nth-child(4) { height: 10px; }

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
}
.scroll-area {
  flex: 1;
  overflow: auto;
  padding: 0 18px calc(var(--safe-bottom) + 10px);
  scrollbar-width: none;
}
.scroll-area::-webkit-scrollbar { display: none; }

.hero-card {
  background: linear-gradient(180deg, var(--blue) 0%, var(--blue-2) 100%);
  border-radius: 32px;
  padding: 22px 18px 20px;
  color: white;
  box-shadow: 0 20px 34px rgba(47,108,246,.26);
}
.brand-inline {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-inline img {
  width: 46px;
  height: 46px;
  object-fit: contain;
  border-radius: 14px;
  background: rgba(255,255,255,.16);
  padding: 6px;
}
.brand-name {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .2px;
}
.brand-sub {
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.35;
  color: rgba(255,255,255,.92);
  max-width: 82%;
}

.role-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 22px;
  position: relative;
  z-index: 2;
}
.role-card {
  background: rgba(255,255,255,.92);
  border-radius: 24px;
  padding: 18px 12px;
  text-align: center;
  border: 2px solid transparent;
  box-shadow: 0 14px 28px rgba(19,34,67,.10);
  cursor: pointer;
}
.role-card.active {
  border-color: #cde1ff;
  box-shadow: 0 18px 30px rgba(47,108,246,.16);
}
.role-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 10px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  color: white;
}
.role-icon svg {
  width: 28px;
  height: 28px;
}
.role-icon.student { background: linear-gradient(180deg, #4e86ff 0%, #3b6de8 100%); }
.role-icon.enterprise { background: linear-gradient(180deg, #36d09d 0%, #18af83 100%); }
.role-title { font-size: 18px; font-weight: 800; }
.role-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

.segmented {
  background: #f4f7fd;
  border: 1px solid #dbe6f5;
  padding: 4px;
  border-radius: 18px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.segmented button {
  border: none;
  background: transparent;
  border-radius: 14px;
  padding: 11px 8px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
}
.segmented button.active {
  background: white;
  box-shadow: 0 8px 16px rgba(24,42,75,.08);
  color: var(--blue-2);
}
.btn {
  border: none;
  border-radius: 18px;
  padding: 14px 16px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
}
.btn:active { transform: translateY(1px) scale(.995); }
.btn-primary {
  background: linear-gradient(180deg, var(--blue) 0%, var(--blue-2) 100%);
  color: white;
  box-shadow: 0 16px 26px rgba(47,108,246,.24);
}
.btn-secondary {
  background: white;
  color: var(--blue-2);
  border: 1px solid #cfe0ff;
}
.btn-ghost {
  background: var(--blue-soft);
  color: var(--blue-2);
}
.btn-success {
  background: linear-gradient(180deg, var(--green) 0%, #21ab6b 100%);
  color: white;
}
.muted-note {
  text-align: center;
  color: #4dbf86;
  font-weight: 700;
  font-size: 13px;
}

.stack { display: flex; flex-direction: column; gap: 14px; }

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}
.back-btn {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  border: 1px solid #d8e4f4;
  background: rgba(255,255,255,.92);
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: 0 0 auto;
}
.page-title {
  font-size: 18px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: .2px;
}
.page-subtitle {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}
.page-right-badge {
  border-radius: 999px;
  padding: 8px 11px;
  font-size: 11px;
  font-weight: 800;
  color: #28b868;
  background: rgba(235,251,242,.86);
  border: 1px solid #cfeedd;
  white-space: nowrap;
}

.search {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,.86);
  border-radius: 16px;
  border: 1px solid #dfe8f6;
  padding: 12px 14px;
  color: var(--muted);
  margin-bottom: 16px;
}
.search.compact {
  width: 82%;
  max-width: 280px;
}
.search input {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  font: inherit;
  color: var(--text);
}

.section-title {
  font-size: 17px;
  font-weight: 850;
  margin-bottom: 10px;
}
.section-caption {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 10px;
}

.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  padding: 9px 12px;
  border-radius: 999px;
  border: 1px solid #d7e3f4;
  background: rgba(255,255,255,.86);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.chip.active {
  color: var(--blue-2);
  background: #eaf2ff;
  border-color: #b8d2ff;
}
.card {
  background: rgba(255,255,255,.92);
  border: 1px solid #dbe6f4;
  border-radius: 24px;
  padding: 16px;
  box-shadow: 0 14px 28px rgba(18,39,80,.07);
}
.card-title {
  font-size: 15px;
  font-weight: 850;
}
.card-sub {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
  line-height: 1.4;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.thumb {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: linear-gradient(180deg, #edf4ff 0%, #e5efff 100%);
  flex: 0 0 auto;
  border: 1px solid #dbe6f4;
  display: grid;
  place-items: center;
  color: var(--blue-2);
}
.thumb svg {
  width: 24px;
  height: 24px;
}
.thumb.translate {
  background: linear-gradient(180deg, #edf4ff 0%, #e4efff 100%);
  color: var(--blue);
}
.thumb.excel {
  background: linear-gradient(180deg, #ebfbf2 0%, #dff7eb 100%);
  color: #1fb56a;
}
.thumb.design {
  background: linear-gradient(180deg, #fff5ea 0%, #ffedd6 100%);
  color: #f0952f;
}
.thumb.support {
  background: linear-gradient(180deg, #f3f4ff 0%, #eceeff 100%);
  color: #6759ff;
}
.small-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
}
.small-badge.green { color: #25b868; background: #eefbf3; }
.small-badge.blue { color: var(--blue-2); background: var(--blue-soft); }
.small-badge.orange { color: #f0952f; background: #fff5ea; }

.price {
  font-weight: 900;
  color: var(--blue-2);
}
.price.green { color: #1ab768; }

.job-card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: rgba(255,255,255,.94);
  border-radius: 22px;
  padding: 14px;
  border: 1px solid #dbe5f4;
  box-shadow: 0 12px 26px rgba(18,39,80,.06);
}
.job-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.mini-btn {
  border: none;
  border-radius: 14px;
  padding: 9px 14px;
  font-weight: 800;
  cursor: pointer;
}
.mini-btn.primary { background: var(--blue); color: white; }
.mini-btn.secondary { background: #eff5ff; color: var(--blue-2); }
.mini-btn.success { background: #eefbf3; color: #1fb56a; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.stat-card {
  background: rgba(255,255,255,.88);
  border: 1px solid #dbe5f4;
  border-radius: 20px;
  padding: 14px 12px;
}
.stat-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}
.stat-value {
  margin-top: 4px;
  font-size: 18px;
  font-weight: 900;
}
.stat-value.blue { color: var(--blue); }
.stat-value.green { color: var(--green); }
.stat-value.orange { color: var(--orange); }

.progress-wrap {
  margin-top: 10px;
}
.progress-track {
  height: 10px;
  border-radius: 999px;
  background: #e7eef9;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--blue) 0%, #5fa0ff 100%);
}

.message-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 13px 14px;
  border-radius: 18px;
  background: rgba(255,255,255,.86);
  border: 1px solid #dbe6f4;
}
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  font-weight: 900;
  flex: 0 0 auto;
}
.avatar.blue { background: #4e86ff; }
.avatar.green { background: #16b88a; }
.avatar.orange { background: #f5a03a; }
.rating {
  color: #f3b224;
  letter-spacing: 1.4px;
  font-size: 13px;
}

.profile-card {
  background: white;
  border: 1px solid #dce6f4;
  border-radius: 24px;
  padding: 16px;
  box-shadow: 0 14px 24px rgba(18,39,80,.06);
}
.wallet-card {
  background: linear-gradient(180deg, #2f6cf6 0%, #1f56c7 100%);
  color: white;
  border-radius: 22px;
  padding: 16px;
}
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.portfolio-item {
  background: #f3f7fe;
  border-radius: 14px;
  padding: 10px;
  border: 1px solid #dce6f4;
  min-height: 84px;
}
.portfolio-thumb {
  height: 42px;
  border-radius: 10px;
  background: linear-gradient(180deg, #76a7ff 0%, #4f83fb 100%);
  margin-bottom: 8px;
}

.form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.form label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-size: 12px;
  font-weight: 800;
}
.form input, .form textarea, .form select {
  width: 100%;
  border: 1px solid #dbe5f4;
  background: rgba(255,255,255,.92);
  border-radius: 16px;
  padding: 13px 14px;
  font: inherit;
  color: var(--text);
  outline: none;
}
.form textarea { min-height: 116px; resize: none; }
.option-box {
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255,255,255,.88);
  border: 1px solid #dbe5f4;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.timeline {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  align-items: start;
}
.timeline-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}
.timeline-step .dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #dfe7f6;
}
.timeline-step.done .dot { background: var(--blue); }
.timeline-step.active .dot { background: var(--orange); }

.bottom-nav {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 12px;
  height: 70px;
  border-radius: 24px;
  background: rgba(255,255,255,.92);
  border: 1px solid #dbe6f4;
  box-shadow: 0 16px 28px rgba(18,39,80,.10);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 8px 10px 10px;
  z-index: 4;
}
.nav-item {
  border: none;
  background: transparent;
  color: #94a3bb;
  font-size: 11px;
  font-weight: 800;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.nav-item svg {
  width: 20px;
  height: 20px;
}
.nav-item.active {
  color: var(--blue);
}
.hero-metric {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.metric-box {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 18px;
  padding: 12px 10px;
}
.metric-box .label {
  color: rgba(255,255,255,.76);
  font-size: 11px;
}
.metric-box .value {
  margin-top: 4px;
  font-weight: 900;
  font-size: 22px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(9,15,28,.38);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 30;
  padding: 20px;
}
.modal {
  width: min(360px, 94vw);
  background: white;
  border-radius: 28px;
  padding: 22px;
  box-shadow: 0 30px 70px rgba(10,20,40,.28);
  text-align: center;
}
.modal-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 12px;
  border-radius: 22px;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, #eef7ff 0%, #e5efff 100%);
  color: var(--blue);
  font-size: 28px;
  font-weight: 900;
}
.modal-title {
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 8px;
}
.modal-text {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
  margin-bottom: 16px;
}
.modal-actions {
  display: flex;
  gap: 10px;
}
.modal-actions .btn {
  flex: 1;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(21,33,63,.92);
  color: white;
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: .24s ease;
  z-index: 40;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (max-height: 860px) {
  .phone {
    min-height: 700px;
  }
}
@media (max-width: 768px) {
  .desktop-toolbar {
    right: 10px;
    top: 10px;
    gap: 6px;
    padding: 6px;
  }
  .toolbar-btn {
    padding: 9px 12px;
    font-size: 11px;
  }
  .phone {
    min-height: 680px;
  }
}
</style>
</head>
<body>
<div class="app-stage">
  <div class="desktop-glow"></div>

  <div class="desktop-toolbar">
    <button class="toolbar-btn" onclick="jumpStudent()">Étudiant</button>
    <button class="toolbar-btn" onclick="jumpEnterprise()">Entreprise</button>
    <button class="toolbar-btn" onclick="go('onboarding', false)">Accueil</button>
    <button class="toolbar-btn primary" onclick="toggleFullscreen()">Plein écran</button>
  </div>

  <div class="phone-wrap">
    <div class="phone-shell">
      <div class="phone">

function go(route, push = true) {
  state.route = route;
  if (push) {
    const last = state.stack[state.stack.length - 1];
    if (last !== route) state.stack.push(route);
  }
  render();
}

function backTo(previous) {
  if (previous) {
    go(previous, true);
    return;
  }
  if (state.stack.length > 1) {
    state.stack.pop();
    state.route = state.stack[state.stack.length - 1];
    render();
  } else {
    go('onboarding', false);
  }
}

function setRole(role) {
  state.role = role;
  render();
}

function jumpStudent() {
  state.role = 'student';
  state.stack = ['student-home'];
  go('student-home', false);
}

function jumpEnterprise() {
  state.role = 'enterprise';
  state.stack = ['enterprise-dashboard'];
  go('enterprise-dashboard', false);
}

          </div>
        </div>
      </div>
    </div>
  </div>
  ${bottomNav('enterprise', 'dashboard')}`;
}

function renderEnterprisePublish() {
  return `
  <div class="scroll-area">
    ${pageHead('Publier une mission', 'Décrivez votre besoin', '', false)}
    <div class="form">
      <label>Titre de la mission
        <input value="Création de 10 visuels Instagram" />
      </label>
      <label>Catégorie

      </label>

        <input value="3 jours" />
      </label>

      </label>

        <div class="card-title" style="font-size:14px;">Mise en avant 48h</div>
        <div class="card-sub">Option future disponible</div>
      </div>
      <div class="price">1 000 DA</div>
    </div>
    <button class="btn btn-primary" style="width:100%; margin-top:16px;" onclick="showModal('Mission publiée', 'Votre mission est maintenant visible par les étudiants. Passons à la sélection des talents.', 'Voir les talents', () => go('enterprise-talents'))">Publier maintenant</button>

function talentCard(talent) {
  return `
  <div class="card">
    <div class="row">
      <div class="avatar ${talent.color}" style="width:44px;height:44px;">${talent.initials}</div>
      <div style="flex:1">
        <div class="row-between" style="align-items:flex-start;">
          <div>
            <div class="card-title">${talent.name}</div>
            <div class="card-sub">${talent.role}</div>
          </div>
          <div class="small-badge blue">${talent.price}</div>
        </div>
        <div class="row-between" style="margin-top:8px;">
          <div class="rating">★★★★☆ <span style="color:var(--text); font-weight:900; margin-left:6px;">${talent.rating}</span></div>
          <div class="row" style="gap:8px;">
            <button class="mini-btn secondary" onclick="openTalent('${talent.name}')">Profil</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderEnterpriseTalents() {
  return `
  <div class="scroll-area">
    ${pageHead('Talents étudiants', 'Sélectionnez le meilleur profil', '', false)}
    ${searchBar('Rechercher par compétence...', 'compact')}
    <div class="chips" style="margin-bottom:16px;">
      <div class="chip active">Design</div>
      <div class="chip">Traduction</div>
      <div class="chip">IT</div>
    </div>
    <div class="stack">${talents.map(talentCard).join('')}</div>
  </div>
  ${bottomNav('enterprise', 'talents')}`;
}

function renderEnterpriseStudentProfile() {
  const talent = talents.find(t => t.name === state.selectedTalent) || talents[0];
  return `
  <div class="scroll-area">
    ${pageHead(talent.name, 'Profil consulté côté entreprise')}
    <div class="profile-card">
      <div class="row">
        <div class="avatar ${talent.color}" style="width:64px;height:64px;font-size:26px;">${talent.initials}</div>
        <div style="flex:1">
          <div class="row-between"><div class="card-title" style="font-size:22px;">${talent.name}</div><div class="small-badge green">Disponible</div></div>
          <div class="card-sub">${talent.role}</div>
          <div class="row-between" style="margin-top:8px;"><div class="rating">★★★★☆</div><div style="font-weight:900;">${talent.rating}</div></div>
        </div>
      </div>
      <div class="chips" style="margin-top:14px;">
        ${talent.skills.map(s => `<div class="chip active">${s}</div>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="card-title">Portfolio</div>
      <div class="portfolio-grid" style="margin-top:12px;">
        <div class="portfolio-item"><div class="portfolio-thumb"></div><div class="card-sub">Design Instagram</div></div>
        <div class="portfolio-item"><div class="portfolio-thumb"></div><div class="card-sub">Brand Kit</div></div>
        <div class="portfolio-item"><div class="portfolio-thumb"></div><div class="card-sub">Affiche promo</div></div>
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="row-between">
        <div>
          <div class="card-title">Tarif estimé</div>
          <div class="card-sub">Mission courte, livraison en 3 jours</div>
        </div>
        <div class="price green">${talent.price}</div>
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:14px;" onclick="go('enterprise-payment')">Sélectionner ce talent</button>
    </div>
  </div>
  ${bottomNav('enterprise', 'talents')}`;
}

function renderEnterprisePayment() {
  const payTalent = talents.find(t => t.name === state.selectedTalent) || talents[0];
  return `
  <div class="scroll-area">
    ${pageHead('Paiement et suivi', 'Modèle transparent et simple', '', false)}
    <div class="card">
      <div class="card-title" style="font-size:20px;">Mission: Traduction catalogue</div>
      <div class="card-sub">Prestataire: ${payTalent.name}</div>
      <div class="stack" style="margin-top:14px; gap:10px;">
        <div class="row-between"><div class="card-sub">Montant mission</div><div class="price">10 000 DA</div></div>
        <div class="row-between"><div class="card-sub">Commission plateforme</div><div class="price">1 500 DA</div></div>
        <div class="row-between"><div class="card-sub">Montant étudiant</div><div class="price green">8 500 DA</div></div>
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:16px;" onclick="showModal('Paiement effectué', 'La mission est confirmée. Le suivi de progression est maintenant activé.', 'Continuer', null)">Payer maintenant</button>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="card-title">Suivi de mission</div>
      <div class="timeline" style="margin-top:16px;">
        <div class="timeline-step done"><div class="dot"></div><div>Publication<br>faite</div></div>
        <div class="timeline-step done"><div class="dot"></div><div>Sélection<br>faite</div></div>
        <div class="timeline-step active"><div class="dot"></div><div>Exécution<br>en cours</div></div>
        <div class="timeline-step"><div class="dot"></div><div>Évaluation<br>à venir</div></div>
      </div>
      <div class="card-sub" style="margin-top:14px;">Étudiants: accès gratuit · Revenus issus des clients et de la commission.</div>
    </div>
  </div>
  ${bottomNav('enterprise', 'payments')}`;
}

function renderOnboarding() {
  return `
  <div class="scroll-area">
    <div class="hero-card">
      <div class="brand-inline">
        <img src="${BRAND_ICON}" alt="StudentLink logo" />
        <div>
          <div class="brand-name">StudentLink</div>
          <div style="opacity:.82; font-size:11px; margin-top:2px;">Plateforme étudiante intelligente</div>
        </div>
      </div>
      <div class="brand-sub">Transforme tes compétences en revenu et aide les entreprises à trouver le bon talent.</div>
    </div>

    <div class="role-row">
      <div class="role-card ${state.role === 'student' ? 'active' : ''}" onclick="setRole('student')">
        <div class="role-icon student">${icons.studentCap}</div>
        <div class="role-title">Étudiant</div>
        <div class="role-sub">Profil + Missions</div>
      </div>
      <div class="role-card ${state.role === 'enterprise' ? 'active' : ''}" onclick="setRole('enterprise')">
        <div class="role-icon enterprise">${icons.building}</div>
        <div class="role-title">Entreprise</div>
        <div class="role-sub">Demandes + Paiement</div>
      </div>
    </div>

    <div class="stack" style="margin-top:20px;">
      <button class="btn btn-primary" onclick="go('login')">Connexion</button>
      <button class="btn btn-secondary" onclick="showToast('Compte de démonstration prêt à être créé')">Créer un compte</button>
      <div class="muted-note">${state.role === 'student' ? 'Accès gratuit pour les étudiants' : 'Publiez une mission et payez avec commission'} </div>
    </div>
  </div>`;
}

function renderLogin() {
  return `
  <div class="scroll-area">
    ${pageHead('Connexion', state.role === 'student' ? 'Accédez à votre espace étudiant' : 'Accédez à votre espace entreprise')}
    <div class="card" style="padding:18px;">
      <div class="brand-inline" style="margin-bottom:12px;">
        <img src="${BRAND_ICON}" alt="Logo" style="width:42px;height:42px;" />
        <div>
          <div class="card-title" style="font-size:18px;">Bienvenue sur StudentLink</div>
          <div class="card-sub">Connexion rapide pour la démonstration</div>
        </div>
      </div>
      <div class="form">
        <label>Email
          <input value="${state.role === 'student' ? 'badr.eddine@studentlink.dz' : 'contact@smartshop.dz'}" />
        </label>
        <label>Mot de passe
          <input type="password" value="studentlink" />
        </label>
      </div>
      <div class="row-between" style="margin-top:12px;">
        <div class="card-sub">Mode démo sécurisé</div>
        <div class="small-badge blue">${state.role === 'student' ? 'Étudiant' : 'Entreprise'}</div>
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:16px;" onclick="${state.role === 'student' ? "go('student-home')" : "go('enterprise-dashboard')"}">Se connecter</button>
      <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="go('onboarding')">Changer de rôle</button>
    </div>
  </div>`;
}

function currentView() {
  switch (state.route) {
    case 'onboarding': return renderOnboarding();
    case 'login': return renderLogin();
    case 'student-home': return renderStudentHome();
    case 'student-mission-detail': return renderMissionDetail('Cours Excel pour étudiants','4 500 DA','48h','Formation / Bureautique','Nous recherchons un étudiant capable d’animer un mini atelier Excel pour débutants. La mission comprend la préparation d’un support simple, la démonstration des fonctions de base et l’accompagnement des participants.');
    case 'student-mission-detail-2': return renderMissionDetail('Traduction FR-EN de CV','2 000 DA','24h','Traduction','Traduction rapide d’un CV du français vers l’anglais avec relecture et adaptation au format professionnel.');
    case 'student-missions': return renderStudentMissions();
    case 'student-chat': return renderStudentChat();
    case 'student-profile': return renderStudentProfile();
    case 'student-wallet': return renderStudentWallet();
    case 'enterprise-dashboard': return renderEnterpriseDashboard();
    case 'enterprise-publish': return renderEnterprisePublish();
    case 'enterprise-talents': return renderEnterpriseTalents();
    case 'enterprise-student-profile': return renderEnterpriseStudentProfile();
    case 'enterprise-payment': return renderEnterprisePayment();
    default: return renderOnboarding();
  }
}

function render() {
  document.getElementById('screen-root').innerHTML = currentView();
}

function openTalent(name) {
  state.selectedTalent = name;
  go('enterprise-student-profile');
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
}

function showModal(title, text, actionLabel = 'Continuer', actionFn = null) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-text').textContent = text;
  document.getElementById('modal-action').textContent = actionLabel;
  document.getElementById('modal-action').onclick = () => {
    closeModal();
    if (typeof actionFn === 'function') actionFn();
  };
  document.getElementById('modal-backdrop').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal-backdrop').style.display = 'none';
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

render();
</script>
